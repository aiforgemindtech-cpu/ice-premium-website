<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content editor · ICE-PREMIUM LIMITED</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      body { margin: 0; background: #070d1f; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        font-family: system-ui, sans-serif; color: #d4af37; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div>
        <p style="font-size: 20px; font-weight: 700">ICE-PREMIUM LIMITED</p>
        <p style="color: rgba(255, 255, 255, 0.6)">Loading the content editor…</p>
      </div>
    </div>

    <!-- Decap CMS. Loaded from a CDN so it adds nothing to the site's own bundle. -->
    <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
    <script>
      window.addEventListener("load", function () {
        var el = document.getElementById("loading");
        if (el) el.remove();
      });
    </script>
  </body>
</html>
